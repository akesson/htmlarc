[package]
name = "htmlarc-archive"
description = "A single-file archive of pre-parsed HTML documents, CSS-queryable without re-parsing"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fs-err = { workspace = true }
htmlarc-dom = { workspace = true }
memmap2 = "0.9"
rkyv = { workspace = true }
seahash = { workspace = true }
thiserror = { workspace = true }
unicode-segmentation = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
criterion = { workspace = true, features = ["html_reports"] }

[[bench]]
harness = false
name = "mmap_read"

[[bench]]
harness = false
name = "string_access"
