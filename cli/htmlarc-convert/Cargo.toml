[package]
name = "htmlarc-convert"
description = "Convert ZIM, WARC, or a directory of HTML files into an .htmlarc archive, and probe corpus statistics"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "htmlarc-convert"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
flate2.workspace = true
htmlarc-dom.workspace = true
htmlarc-archive.workspace = true
html5gum.workspace = true
unicode-normalization.workspace = true
walkdir.workspace = true
xflags.workspace = true
zim.workspace = true
zstd.workspace = true
# Allocation profiler — inert (no compile/runtime cost) unless a `hotpath*` feature is enabled.
hotpath = "0.17"

[features]
# `cargo run -p htmlarc-convert --features hotpath,hotpath-alloc -- convert …` to profile.
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]

[dev-dependencies]
insta.workspace = true
