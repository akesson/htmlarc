# Union of runtime/build dependencies across the release platforms. Prefer MIT
# when a dependency offers it as an alternative; retain complete license texts.
accepted = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "Unlicense", "AGPL-3.0-only"]
ignore-dev-dependencies = true
