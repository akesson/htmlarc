# Artifact targets are selected by generate_notices.py. Exclude development and
# build-only dependencies; retain procedural macros that may contribute generated code.
accepted = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "Unlicense", "AGPL-3.0-only"]
ignore-dev-dependencies = true

ignore-build-dependencies = true

# encoding_rs's license scan also matches `src/gb18030_2022.rs`, which would put Rust source into
# the notices. Name its real license files instead.
[encoding_rs.clarify]
license = "(Apache-2.0 OR MIT) AND BSD-3-Clause"

[[encoding_rs.clarify.files]]
path = "LICENSE-APACHE"
license = "Apache-2.0"
checksum = "cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30"

