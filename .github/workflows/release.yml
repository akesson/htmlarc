name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt an upload halfway through a release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check release version
        run: |
          python - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as f:
              manifest = tomllib.load(f)
          version = manifest['workspace']['package']['version']
          from pathlib import Path
          assert Path(f'docs/releases/v{version}.md').is_file(), 'Missing release notes'
          for name in ('htmlarc-dom', 'htmlarc-archive'):
              assert manifest['workspace']['dependencies'][name]['version'] == version
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag must match Cargo.toml'
          PY
      - run: python scripts/package_notices.py
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings
      - run: cargo doc --no-deps --locked -p htmlarc-dom -p htmlarc-archive -p htmlarc
        env:
          RUSTDOCFLAGS: '-D warnings'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked
      - name: Verify crates together, including unpublished local dependencies
        run: cargo publish --dry-run --locked -p htmlarc-dom -p htmlarc-archive -p htmlarc

  wheels:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.15.0'
          target: ${{ matrix.target }}
          manylinux: '2014'
          args: --release --locked --strip -m crates/htmlarc-py/Cargo.toml -o dist
      - uses: astral-sh/setup-uv@v7
      - name: Test installed wheel on minimum and recent CPython
        run: |
          for version in 3.10 3.14; do
            uv venv --python "$version" wheel-test
            if [[ "$RUNNER_OS" == Windows ]]; then
              python=wheel-test/Scripts/python.exe
            else
              python=wheel-test/bin/python
            fi
            uv pip install --python "$python" dist/*.whl pytest pyarrow polars
            "$python" -m pytest crates/htmlarc-py/tests
            rm -rf wheel-test
          done
      - uses: actions/upload-artifact@v6
        with:
          name: python-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: astral-sh/setup-uv@v7
      - run: uvx maturin==1.15.0 sdist -m crates/htmlarc-py/Cargo.toml -o dist
      - name: Build and test from the source distribution
        run: |
          uv venv --python 3.12 sdist-test
          uv pip install --python sdist-test/bin/python dist/*.tar.gz pytest pyarrow polars
          sdist-test/bin/python -m pytest crates/htmlarc-py/tests
      - uses: actions/upload-artifact@v6
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  binaries:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --release --locked -p htmlarc -p htmlarc-convert
      - name: Reject non-system dynamic dependencies
        run: python3 scripts/check_binary_links.py target/release/htmlarc target/release/htmlarc-convert
      - name: Smoke-test binaries and assemble download
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          target/release/htmlarc --help
          target/release/htmlarc-convert --help
          for binary in htmlarc htmlarc-convert; do
            if "target/release/$binary" --not-a-real-option; then
              echo "$binary incorrectly accepted an unknown option" >&2
              exit 1
            fi
          done
          mkdir -p smoke/pages
          echo '<html><body><h1>Release smoke test</h1></body></html>' > smoke/pages/page.html
          target/release/htmlarc pack smoke/pages -o smoke/pages.htmlarc
          target/release/htmlarc list smoke/pages.htmlarc
          target/release/htmlarc-convert convert smoke/pages smoke/converted.htmlarc
          target/release/htmlarc list smoke/converted.htmlarc
          mkdir -p dist bundle
          cp target/release/htmlarc target/release/htmlarc-convert LICENSE NOTICE COMMERCIAL.md cli/htmlarc-convert/THIRD_PARTY_NOTICES.txt README.md bundle/
          tar -czf "dist/htmlarc-${RELEASE_TARGET}.tar.gz" -C bundle .
      - uses: actions/upload-artifact@v6
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  pypi:
    # A manual run is always a rehearsal, even if a tag was selected.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist, binaries]
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: python-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  crates:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist, binaries]
    runs-on: ubuntu-22.04
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Publish crates in dependency order
        run: cargo publish --locked -p htmlarc-dom -p htmlarc-archive -p htmlarc
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [pypi, crates]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - name: Create draft release with binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --notes-file "docs/releases/${RELEASE_TAG}.md"
