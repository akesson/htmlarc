name: recipes smoke

# Weekly canary for the examples/python recipes: they run against LIVE endpoints
# (Common Crawl index + data, the Wayback CDX API, Kiwix, books.toscrape.com), so
# they can rot without any commit — an index format change, a moved ZIM, a dead
# site. A red run here means "fix the recipe before a reader hits it", which
# matters more than usual while the recipes are launch collateral.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC (off the whole-hour load spike)
  workflow_dispatch:

jobs:
  recipes:
    name: run all recipes
    runs-on: ubuntu-latest
    # Build + 8 recipes fit well inside 30; the notebook step adds a download
    # cell whose worst-case retry budget (see below) needs the extra headroom.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: astral-sh/setup-uv@v7
      # Release build: the recipes chew through real corpora; debug parse speed
      # would dominate the job's wall clock.
      - run: uvx maturin build --release -m crates/htmlarc-py/Cargo.toml -o dist
      # Small limits: enough to exercise every code path (metadata columns,
      # append, skip handling) while staying polite to the live services.
      - name: run recipes
        working-directory: examples/python
        run: |
          WHEEL=$(ls ../../dist/htmlarc-*.whl)
          uv run --with "$WHEEL" warc_to_archive.py --limit 200
          uv run --with "$WHEEL" warc_to_archive.py --append --limit 50
          uv run --with "$WHEEL" corpus_questions.py
          uv run --with "$WHEEL" rag_chunking.py
          uv run --with "$WHEEL" extractor_from_archive.py
          uv run --with "$WHEEL" zim_wiktionary.py
          uv run --with "$WHEEL" site_audit.py
          uv run --with "$WHEEL" snapshot_diff.py
      # The Common Crawl notebook hits the same live endpoints; execute it
      # headless (small sample — politeness, and CI wall clock). The --with
      # list is the notebook's "Requirements" line (cell 0) plus
      # nbconvert/ipykernel to drive it — keep the two in sync. The cell
      # timeout is sized for the download cell's worst case (three requests,
      # each with a ~4-minute backoff ladder, plus up to two mid-stream
      # restarts), so a CC bad spell surfaces as an HTTP error from the retry
      # loop rather than a CellTimeoutError that masks it.
      - name: execute common_crawl.ipynb
        working-directory: examples/python
        run: |
          WHEEL=$(ls ../../dist/htmlarc-*.whl)
          CC_SAMPLE_DOCS=200 uv run --with "$WHEEL" \
            --with nbconvert --with ipykernel \
            --with polars --with lxml --with cssselect --with warcio --with requests \
            jupyter-nbconvert --to notebook --execute --stdout \
            --ExecutePreprocessor.timeout=1500 common_crawl.ipynb > /dev/null
