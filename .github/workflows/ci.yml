name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/package_notices.py
      # Honors the channel + components pinned in rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all --check

  release-hygiene:
    name: documentation and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings
      - run: cargo doc --no-deps --locked -p htmlarc-dom -p htmlarc-archive -p htmlarc -p htmlarc-convert
        env:
          RUSTDOCFLAGS: '-D warnings'
      # Separate invocation avoids the Python library and CLI sharing a rustdoc path.
      - run: cargo doc --no-deps --locked -p htmlarc-py
        env:
          RUSTDOCFLAGS: '-D warnings'

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # Tests run under nextest (process-per-test): some glob! snapshot tests rely
      # on that isolation, and plain `cargo test` can be flaky for them.
      - uses: taiki-e/install-action@nextest
      # The htmlarc-convert e2e tests are #[ignore]d (they need a non-redistributable
      # ZIM fetched by fetch-testdata.sh), so the default run stays hermetic.
      - run: cargo nextest run --workspace
      # Build (but don't run) the benchmarks: bench timings are too noisy on
      # shared runners to gate on, but a bench target that no longer compiles
      # or links should still fail CI.
      - run: cargo bench --workspace --no-run

  python:
    name: python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: astral-sh/setup-uv@v7
      # Debug build: this job gates correctness of the FFI layer, not wheel speed;
      # release wheels are a separate publishing concern.
      - run: uvx maturin build -m crates/htmlarc-py/Cargo.toml -o dist
      - run: |
          uv venv .venv
          # pyarrow so the scan_table PyCapsule stream is verified against a real Arrow consumer.
          uv pip install --python .venv dist/*.whl pytest pyarrow polars
          .venv/bin/pytest crates/htmlarc-py/tests
      - name: run offline quickstart from a fresh directory
        run: |
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/.venv/bin/python" "$GITHUB_WORKSPACE/examples/python/quickstart.py"
