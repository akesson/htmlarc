[workspace]
resolver = "2"
members = ["crates/*", "cli/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "AGPL-3.0-only"
repository = "https://github.com/akesson/htmlarc"

[workspace.dependencies]
anyhow = "1.0"
# Arrow columnar buffers + C-Data-Interface export (`Archive.scan_table` in htmlarc-py):
# array/buffer/schema crates plus arrow-array's `ffi` feature for the PyCapsule stream.
# No `pyarrow` bridge crate and no compute kernels — the wheel gains no Python-side dependency
# and the capsule glue is ours, so arrow's quarterly majors never fight the pyo3 pin.
arrow-array = { version = "59", features = ["ffi"] }
arrow-buffer = "59"
arrow-schema = "59"
colorful = "0.3"
criterion = { version = "0.8", features = ["html_reports"] }
# Pure-Rust gzip (miniz_oxide backend) for reading `.warc.gz` crawl segments.
flate2 = "1.0"
fs-err = "3.1"
function_name = "0.3"
hashbrown = "0.17"
# Function-level CPU/alloc profiler. Inert (zero cost) unless a crate's `hotpath` feature
# enables `hotpath/hotpath`; used by the `profile_walk` example to profile the select walk.
hotpath = "0.22"
html-escape = "0.2"
html5gum = "0.8.3"
indexmap = "2.11"
insta = { version = "1.43", features = ["glob", "json", "yaml"] }
log = "0.4"
pretty = "0.12"
# Python bindings (crates/htmlarc-py). abi3 so one wheel covers every CPython >= 3.10.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
rkyv = { version = "0.8", features = ["pointer_width_64"] }
sanitize-filename = "0.6"
# Best-in-class Rust CSS-selection baseline (html5ever parse + Servo's `selectors`
# engine). Dev-only: used by the `selectors_vs_scraper` comparison bench.
scraper = "0.27"
seahash = "4.1"
# Sound self-referential structs; lets `OwnedSelectorList` own its selector source string
# while holding the borrowing `SelectorList` parsed from it (a `'static` handle for bindings).
self_cell = "1.2"
smallvec = "1.13"
strum = "0.28"
strum_macros = "0.28"
termion = "4.0"
thiserror = "2.0"
tinyvec = { version = "1.8", features = ["alloc"] }
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
walkdir = "2.5"
xflags = "0.3"
zstd = "0.13"
# Fork of the unmaintained `zim` 0.4 crate, patched to open modern ZIMs (header
# minor version >= 2, which omit the legacy title pointer list). See akesson/zim.
zim = { git = "https://github.com/akesson/zim", branch = "fix-modern-zim-title-ptr" }

# internal crates
htmlarc-dom = { path = "crates/htmlarc-dom" }
htmlarc-archive = { path = "crates/htmlarc-archive" }

# Speed up insta/similar in dev so snapshot tests run fast.
[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3

# Release-grade codegen with debug symbols, so `samply` can resolve frames when profiling
# the `profile_walk` example: `cargo build -p htmlarc-archive --example profile_walk --profile profiling`.
[profile.profiling]
inherits = "release"
debug = true
